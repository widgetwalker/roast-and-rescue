<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#000" stroke-width="1.5"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', Courier, monospace; }
      .disp { font-family: 'Space Grotesk', Arial Black, sans-serif; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
      .march { stroke-dasharray: 14 10; animation: march 1.2s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -48; } }
      .floaty { animation: floaty 2.6s ease-in-out infinite; }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#e0e0e0"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- hard shadow plates -->
  <rect x="78" y="52" width="1044" height="216" fill="#000"/>
  <rect x="66" y="40" width="1044" height="216" fill="#00ffff" stroke="#000" stroke-width="6"/>

  <!-- ROAST block slides in from left -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-700 0" to="0 0" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.9 0.2 1"/>
    <rect x="112" y="86" width="330" height="100" fill="#ff00ff" stroke="#000" stroke-width="6" transform="rotate(-2 277 136)"/>
    <text x="277" y="158" text-anchor="middle" class="disp" font-size="64" font-weight="900" fill="#000" transform="rotate(-2 277 136)">ROAST</text>
  </g>

  <!-- & pops -->
  <text x="490" y="160" text-anchor="middle" class="disp" font-size="56" font-weight="900" fill="#000" opacity="0">
    &amp;
    <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.01s" fill="freeze"/>
  </text>

  <!-- RESCUE block slides in from right -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="700 0" to="0 0" dur="0.7s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.2 0.9 0.2 1"/>
    <rect x="548" y="86" width="380" height="100" fill="#ffff00" stroke="#000" stroke-width="6" transform="rotate(2 738 136)"/>
    <text x="738" y="158" text-anchor="middle" class="disp" font-size="64" font-weight="900" fill="#000" transform="rotate(2 738 136)">RESCUE</text>
  </g>

  <!-- terminal typing bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.01s" fill="freeze"/>
    <rect x="112" y="196" width="640" height="44" fill="#000"/>
    <text x="130" y="226" class="mono" font-size="24" font-weight="700" fill="#00ff00">$ python main.py octocat</text>
    <rect class="blink" x="560" y="204" width="16" height="28" fill="#00ff00"/>
  </g>

  <!-- lightning badge -->
  <g class="floaty">
    <rect x="972" y="86" width="120" height="154" fill="#fff" stroke="#000" stroke-width="6" transform="rotate(8 1032 163)"/>
    <polygon points="1048,100 1006,150 1028,150 1012,188 1058,138 1034,138 1052,100" fill="#ffff00" stroke="#000" stroke-width="5" stroke-linejoin="round" transform="rotate(8 1032 163)"/>
    <rect x="986" y="196" width="92" height="28" fill="#000" transform="rotate(8 1032 163)"/>
    <text x="1032" y="217" text-anchor="middle" class="mono" font-size="18" font-weight="900" fill="#ffff00" transform="rotate(8 1032 163)">5.0K/HR</text>
  </g>

  <!-- marching ants frame -->
  <rect class="march" x="10" y="10" width="1180" height="300" fill="none" stroke="#000" stroke-width="4"/>
</svg>

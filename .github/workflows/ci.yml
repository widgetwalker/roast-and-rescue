name: CI & Quality Verification Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-and-build:
    name: Lint, Audit, Test & Build (DevSecOps Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Static Analysis & Type Safety (ESLint + TypeScript Strict)
        run: npm run lint

      - name: "Execute Automated Test Suite (31 Tests: Unit, A11y, Analyzer, REST API)"
        run: npm test

      - name: Production TypeScript Build
        run: npm run build
